[project]
name = "sacm-v2"
version = "0.1.0"
description = "Prompt-free curvilinear structure segmentation on SAM: dual-level geometric adapters, closed-loop coarse-to-fine decoder, topology-aligned training, and strict official ports of 14 topology losses and 20 evaluation metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # Install your CUDA build of torch/torchvision FIRST, e.g.:
    #   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "pillow",
    "matplotlib",
    "tqdm",
    "networkx",
    "PyYAML",
]

[project.optional-dependencies]
# Losses/metrics that need extra native/third-party packages (they are
# registered automatically when these are importable):
topology = [
    "gudhi",
    "torch-topological",
    "POT",
    "opencv-python",
    "monai",
]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}
packages = [
    # framework layer
    "core",
    "core.losses",
    "core.metrics",
    # algorithm layer
    "models",
    "models.sacm",
    "models.sam",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # long lines: the vendored official code is kept verbatim

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: heavy tests (persistence engines); skipped unless --run-slow",
]
