[project]
name = "sacm-x"
version = "0.1.0"
description = "SACM-X: prompt-free curvilinear structure segmentation on SAM with dual-level geometric adapters, closed-loop coarse-to-fine decoding, topology-aligned training, and strict official ports of 14 topology losses and 20 evaluation metrics."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    # Install your CUDA build of torch/torchvision FIRST, e.g.:
    #   pip install torch torchvision --index-url https://download.pytorch.org/whl/cu121
    "torch",
    "torchvision",
    "numpy",
    "scipy",
    "scikit-image",
    "scikit-learn",
    "pillow",
    "matplotlib",
    "opencv-python",
    "tqdm",
    "networkx",
    "PyYAML",
    "wandb",
    "rich",
]

[project.optional-dependencies]
# Losses/metrics that need extra native/third-party packages (they are
# registered automatically when these are importable):
topology = [
    # NOTE: torch-topological 0.1.9 is incompatible with gudhi >= 3.13
    # (CubicalComplex constructor signature changed); 3.10.1 verified.
    "gudhi<3.13",
    "torch-topological",
    "POT",
    "opencv-python",
    "monai",
    "cripser",
    # tcripser (T-construction binding) is not on PyPI; install it from
    # the official CubicalRipser repo when topo_tcripser is needed.
]
data = [
    "h5py",  # CREMI HDF5 conversion in scripts/data/organize_datasets.py
]
sam2 = [
    "hydra-core",
    "omegaconf",
    "imageio",
]
maskvsc = [
    "skan",
    "kornia",
]
bcunet = ["timm"]
cwsam = ["timm"]
medcagd = ["timm"]
sam_refiner = ["FastGeodis"]
sam_med2d = ["albumentations==1.3.1"]
sam_octa = ["albumentations==1.3.1", "safetensors"]
knowsam = ["medpy==0.4.0", "hausdorff", "albumentations==1.3.1"]
nnwnet = ["nnunetv2==2.8.1"]
segdino = ["timm>=1.0"]
matcher = ["POT"]
tuning = ["optuna"]
queue = ["cue-ml"]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["core*", "baseline_zoo*", "models*"]

[tool.setuptools.package-data]
"baseline_zoo.models.sam2_unet" = ["sam2_configs/*.yaml", "LICENSE", "UPSTREAM.md"]

[tool.ruff]
line-length = 120
target-version = "py310"
# Vendored upstream code is kept verbatim; the adapter/tests stay lint-clean.
extend-exclude = [
    "src/baseline_zoo/models/sam2_unet/model.py",
    "src/baseline_zoo/models/sam2_unet/sam2",
    "src/baseline_zoo/models/sam_adapter/common.py",
    "src/baseline_zoo/models/sam_adapter/image_encoder.py",
    "src/baseline_zoo/models/sam_adapter/iou_loss.py",
    "src/baseline_zoo/models/sam_adapter/mask_decoder.py",
    "src/baseline_zoo/models/sam_adapter/transformer.py",
    "src/baseline_zoo/models/topolora/lora.py",
    "src/baseline_zoo/models/topolora/adapters.py",
    "src/baseline_zoo/models/topolora/topo_losses.py",
    "src/baseline_zoo/models/topolora/segment_anything",
    "src/baseline_zoo/models/samed/segment_anything",
    "src/baseline_zoo/models/jtfn/jtfn.py",
    "src/baseline_zoo/models/jtfn/modules.py",
    "src/baseline_zoo/models/jtfn/backbone",
    "src/baseline_zoo/models/dscnet/model.py",
    "src/baseline_zoo/models/dscnet/dsconv.py",
    "src/baseline_zoo/models/dscnet/losses.py",
    "src/baseline_zoo/models/persam/per_segment_anything",
    "src/baseline_zoo/models/matcher",
    "src/baseline_zoo/models/medcagd/model.py",
    "src/baseline_zoo/models/blo_sam/segment_anything",
    "src/baseline_zoo/models/blo_sam/lora.py",
    "src/baseline_zoo/models/blo_sam/prompt.py",
    "src/core/postprocess/sam_refiner/sam_refiner.py",
    "src/core/postprocess/sam_refiner/utils.py",
    "src/core/postprocess/sam_refiner/segment_anything",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # long lines: the vendored official code is kept verbatim

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "slow: heavy tests (persistence engines); skipped unless --run-slow",
]
