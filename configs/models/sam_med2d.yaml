id: sam_med2d
display_name: SAM-Med2D
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model sam_med2d --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method sam_med2d
  --protocol {test_manifest}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Self-contained port of official SAM-Med2D: 256 input, per-block Adapter,
  GT box/point prompts plus 8 error-feedback decoder passes, focal+dice+IoU.
  Uses vanilla SAM ViT-L because the official SAM-Med2D checkpoint is absent;
  oracle-prompted, not prompt-free.
