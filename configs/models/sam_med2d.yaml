id: sam_med2d
display_name: SAM-Med2D
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model sam_med2d --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
  --sam-med2d-model-type vit_b
  --sam-checkpoint checkpoints/sam-med2d_b.pth
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method sam_med2d
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Self-contained port of official SAM-Med2D: 256 input, per-block Adapter,
  GT box/point prompts plus 8 error-feedback decoder passes, focal+dice+IoU.
  Default is the official SAM-Med2D ViT-B checkpoint `sam-med2d_b.pth`
  (Google Drive file id 1ARiB5RkSsWmAB_8mqWnwDF8ZKTtFwsjl); place it at
  `checkpoints/sam-med2d_b.pth`. `--sam-med2d-model-type vit_l`/`vit_h`
  defaults to the matching vanilla SAM checkpoint
  (`sam_vit_l_0b3195.pth`/`sam_vit_h_4b8939.pth`) and is an explicit
  comparison only; a checkpoint that does not cover that architecture is
  rejected. Oracle-prompted, not prompt-free.
