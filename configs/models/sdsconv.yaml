id: sdsconv
display_name: Conv-LoRA + SDSConv
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model sdsconv --stage train
  --data-root {split_root} --workdir {output_root}
  --convlora-model-type vit_b
  --convlora-checkpoint checkpoints/sam_vit_b_01ec64.pth
  --sdsconv-kernel-size 7
  --sdsconv-hidden 64
  --sdsconv-new-lr-mult 10
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method sdsconv
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Project extension, not an official Conv-LoRA/SACM baseline. Builds the
  existing Conv-LoRA port unchanged (qkv Conv-LoRA + multi-scale MoE,
  prompt-free one-token decoder) and adds a zero-initialized sparse-control
  dynamic snake convolution (SDSConv) residual on the SAM image embedding
  before the mask decoder. SDSConv predicts sparse control points,
  RBF-interpolates a dense curvilinear trajectory with centre anchoring and
  aggregates along both image axes; this implementation uses a 64-channel
  bottleneck so the local 11 GiB profile remains usable. The residual is
  zero-initialized, so step 0 is numerically the Conv-LoRA baseline.
  ViT-B is the local profile; ViT-H/L can be selected for the 24 GiB server.
  Eight-hundred-epoch project budget, 18-image 3-shot split,
  validation-Dice selection, GT-resolution export and shared evaluator.
