id: cosna
display_name: CoSNA
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m methods.cosna.run_one --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
  --sam-checkpoint checkpoints/sam_vit_l_0b3195.pth
  --resume --resume-checkpoint best --lr 1e-3
  --cosna-weight 1.0 --cosna-cl 0.1 --cosna-render 1024
  --cosna-coarse 512 --cosna-feature-dim 16
  --cosna-gate 0.10 --cosna-near-radius 4
  --rcd 1 --as-calibration 1 --close-radius 2
  --tile 1024 --stride 896
  --routing-skel-ratio 1.0 --routing-area-ratio 0.7
  --routing-mode auto --num-workers 0 --save-every 0
eval_entrypoint: >-
  python -m methods.cosna.run_one --stage predict
  --data-root {split_root} --protocol {test_manifest}
  --workdir {output_root}
  --checkpoint {output_root}/best_model.pth
  --seed {seed} --device cuda:{gpu} --use-wandb 0
  --rcd 1 --as-calibration 1 --close-radius 2
  --tile 1024 --stride 896
  --routing-skel-ratio 1.0 --routing-area-ratio 0.7
  --routing-mode auto
protocols: [seeded5, fixed]
defaults:
  epochs: 20
  preset: default
note: >-
  CoSNA (Consensus-Guided Snake Reconstruction) is an independent package
  built on a physically copied BCTD-SAM ViT-L + four-candidate decoder,
  with a TCSU-lite snake-upsampling residual on candidate 3 and a label-free
  near-union between the gated candidate-consensus mask and the TCSU-h3 mask.
  Training fits only the 18k-parameter TCSU residual on the 18 source images;
  the BCTD base must be initialized from a trained BCTD checkpoint, not from
  random weights. The canonical near-union radius is 4 px and the gated
  threshold is 0.10. Reference 4-seed test macro is 62.04/48.38/70.28/59.22
  versus the BCTD-SAM + AS champion 61.93/48.29/70.14/59.23; it is a
  rule-level near-miss because seed2/3 HD95 is 0.29/0.33 higher. No target
  labels, target support, or 3-shot protocol changes are used.
