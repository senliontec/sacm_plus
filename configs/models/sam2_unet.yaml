id: sam2_unet
display_name: SAM2-UNet
family: sam
status: available
note: >-
  Self-contained appendix/extended baseline (not one of the paper's ten).
  Vendored SAM2 Hiera-L encoder with per-block prompt-learn adapters and a
  U-Net decoder. Real training requires checkpoints/sam2_hiera_large.pt;
  --random-init is a code-smoke option only.
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model sam2_unet --stage train
  --data-root {split_root} --workdir {output_root}
  --sam2-checkpoint {sam2_checkpoint}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method sam2_unet
  --protocol {test_manifest}
  --checkpoint {output_root}/best_model.pth
  --sam2-checkpoint {sam2_checkpoint}
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 200
