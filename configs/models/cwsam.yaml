id: cwsam
display_name: CWSAM
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model cwsam --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
  --cwsam-encoder vit_b
  --sam-checkpoint checkpoints/sam_vit_b_01ec64.pth
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method cwsam
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Self-contained port of the official CWSAM frequency-prompt/adapter SAM.
  Defaults to ViT-B with the official ViT-B base checkpoint, matching the
  released configs; `--cwsam-encoder vit_l` exposes the paper's claimed
  shared-ViT-L variant as an unverified ablation. Binary segmentation maps
  the official 5-class weighted CE to background 0.1 / foreground 1.0 CE
  plus a 0.5 foreground soft-Dice term; pass --cwsam-bg-weight 1
  --cwsam-fg-weight 1 --cwsam-dice-weight 0 for neutral CE. The adapter
  remaps SAM's prompt_encoder.no_mask_embed and positional-encoding keys,
  which upstream leaves randomly initialized (--cwsam-sam-key-remap off
  reproduces the upstream load), and zero-initialises the final
  cls_upscaling projection (--cwsam-cls-init official restores the
  upstream init); official ImageNet preprocessing and the freeze policy
  are preserved.
