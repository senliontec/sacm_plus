id: cs2net
display_name: CS2Net-2D
family: cnn
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model cs2net --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method cs2net
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 1000
note: >-
  Legacy model id `cs2net`; this row is the official 2D branch
  (`model/csnet.py`, `train.py`) of iMED-Lab/CS-Net, shared by the CS-Net
  MICCAI 2019 and CS2Net MedIA 2021 2D experiments. The 3D extension
  (`model/csnet_3d.py`, `train3d.py`, Conv3d) is a separate network and is
  not applicable to the 2D protocol images. The official 1000-epoch recipe
  is retained; checkpoint selection uses the shared validation Dice.
