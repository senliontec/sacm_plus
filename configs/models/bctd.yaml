id: bctd
display_name: BCTD-SAM
family: sam
status: available
checkpoint: "{output_root}/best_model_fixed3.pth"
train_entrypoint: >-
  python -m baseline_zoo.models.bctd.train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
  --sam-checkpoint checkpoints/sam_vit_l_0b3195.pth
  --bce-weight 0.7 --dice-weight 0.3 --bce-pos-weight 2
  --binary-targets 0 --deploy-threshold 0.5
  --stage2-loss-scope all --topology-head all
  --cl-dice-weight 0.1 --skeleton-recall-weight 0.1
  --specialized-heads 1 --specialized-head-weight 0.1
  --specialized-topology-weight 0.1
  --head-fusion 1 --fusion-loss-weight 1.0
  --topology-resolution 512 --topology-warmup-epochs 5
  --deep-sup-weight 0.3 --head-select gating --deployment-head 3
  --adapter-dim-ratio 0.1 --num-workers 0 --save-every 0
  --train-aug mild --copy-paste-prob 0.5
  --deployed-tversky-weight 0.1 --area-loss-weight 0.1
  --boundary-loss-weight 0.05 --boundary-loss-head boundary
  --boundary-loss-resolution 512 --boundary-loss-warmup-epochs 5
eval_entrypoint: >-
  python -m baseline_zoo.models.bctd.evaluate
  --data-root {split_root} --protocol {test_manifest}
  --workdir {output_root}
  --checkpoint {output_root}/best_model_fixed3.pth
  --seed {seed} --device cuda:{gpu} --use-wandb 0
  --tta-flip --rcd 1 --as-calibration 1 --atc 0
  --tile 1024 --stride 896
  --routing-skel-ratio 1.0 --routing-area-ratio 0.7
protocols: [seeded5, fixed]
defaults:
  epochs: 200
  preset: default
note: >-
  BCTD-SAM is a self-contained baseline model, physically independent of
  TopoStrand-SAM, DCD, SPA-SAM, CurviMix and StrandCal. It owns its SAM
  ViT-L variant, fusion module, topology losses, boundary loss, decoding and
  adaptive-skeleton calibration. Training uses the TopoStrand-SAM
  width-calibrated fixed3 recipe plus a distance-transform boundary loss on
  the Stage-2 boundary head (slot 2; weight 0.05, 512 resolution, 5-epoch
  warmup). Prediction adds four-view flip TTA, resolution-consensus decoding,
  close2, and label-free Adaptive Skeleton Calibration (AS). Reference
  four-seed result: 61.93/48.29/70.14/59.23 on the 20-dataset protocol and
  64.57/51.37/73.63/57.13 on the 12-dataset paper subset. AS thresholds are
  label-free but benchmark-selected; validate them on a held-out split before
  a paper claim.
