id: maskvsc
display_name: MaskVSC
family: cnn
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model maskvsc --stage train
  --data-root {split_root} --workdir {output_root}
  --maskvsc-stage1-epochs 600 --maskvsc-stage2-epochs 200
  --maskvsc-vig-patch-size 16 --maskvsc-vig-decode release
  --maskvsc-vig-graph release --maskvsc-connect-loss release
  --maskvsc-rotation-degrees 30 --maskvsc-norm instance
  --maskvsc-augment mild --maskvsc-stage1-dice-weight 1.0
  --maskvsc-vig-residual 1 --maskvsc-vig-lr 2e-4
  --batch-size 1 --lr 3e-4
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method maskvsc
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Full two-stage MaskVSC (TMI 2025): stage-1 Fundus UNet with masked-vessel
  corruption + Connect_Loss, then the ViG completion head on frozen stage-1
  probability maps; final inference is ViG(Seg(image)). Main baseline uses
  the official release stage-1 behavior (count_nonzero L_C, flip-only
  augmentation) and the released dot-product ViG graph. Stage 2 uses the
  released patch16 ViG decode (official token-fold view, N=1024 predictor
  channels; ViG 23.84M, full 31.61M), soft GCN labels, frozen/eval stage 1,
  no augmentation, and val-Dice selection across both stages. The stage-1
  best is saved first; if stage 2 does not beat it, the final checkpoint
  records use_vig=false and inference uses the UNet alone. The 800-epoch
  budget is split
  600 stage-1 + 200 stage-2; the paper uses 200+200 and per-dataset
  sizes/modality noise (documented in models/maskvsc/UPSTREAM.md), while
  this pooled 20-domain benchmark uses 512/SD20/7x7 for comparability.
  Paper-mode ablations: --maskvsc-connect-loss paper, ±30° rotation via
  --maskvsc-rotation-degrees 30, and --maskvsc-vig-graph paper. The paper
  L_C scale |S-Sg|*N/#foreground is not the default because sparse masks
  receive 10-100x the BCE weight in the pooled 3-shot protocol and caused
  domain collapse; paper mode also skips the released 3x3 opening, which
  erased thin vessels. Use --maskvsc-connect-cap for recalibration. A
  100-epoch seed-0 stage-1 A/B gave best val Dice: release/rot0 0.4612,
  release/rot30 0.4726, paper/rot0 0.1133, paper/rot30 0.1636; rotation is
  tied under release L_C, so the main baseline keeps the release flip-only
  path. --maskvsc-vig-decode coherent is the earlier non-official patch-32
  token-grid reconstruction
  (371.6M ViG), ablation only. No official ViG weights. The MaskVSC paper is
  in parsing/; see UPSTREAM.md for the full paper-code conflict ledger.
  Task adaptation (2026-11-07, deployed): stage 1 uses InstanceNorm, batch
  1, mild flips/90-degree rotations/±30-degree rotation/photometric jitter,
  Adam lr 3e-4 and an added soft-Dice term (weight 1.0) on the released
  BCE+Connect_Loss objective; stage 2 keeps the released clean-input BCE at
  lr 2e-4 with batch 1 and a zero-initialised logit-space residual, and the
  checkpoint still falls back to the stage-1 UNet when the ViG does not beat
  it on validation. The released BN/batch-4/BCE-only stage-1 recipe reached
  only 0.4962 best validation Dice at 200 epochs and 0.5459 at 600 epochs;
  the task-adapted recipe reached 0.6225 at 200 epochs and 0.6431 by epoch
  314 of the 600-epoch run. Label the row "MaskVSC (official architecture;
  task-adapted pooled 3-shot recipe)", not an exact official reproduction.
