id: dka
display_name: DKA
family: non-sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model dka --stage train
  --data-root {split_root} --workdir {output_root}
  --dka-vit-weights checkpoints/segmenter_vit_b16_384.pth
  --dka-middle-dim 192 --dka-adapter-lr 1e-3
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method dka
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Dual-Kernel Adapter (ICLR 2026) segmentation port. The released repo has
  the DKA module and classification training only; the paper's Segmenter-B
  (MMSegmentation) segmentation code is not released. This port keeps DKA
  in all 12 blocks (51x51 + 5x5 depthwise branches, middle dim 192,
  zero-init down/up) and reconstructs MMSegmentation's Segmenter-B ViT-B/16
  host with its exact key layout: official ImageNet-21k checkpoint,
  384->512 learned position embedding resize, 0.1 stochastic depth (FFN),
  final LayerNorm, `(x-127.5)/127.5` normalization and a linear 1x1 FCN
  head. Head lr 1e-4 / DKA lr 1e-3, batch 1, CE + foreground Dice,
  800 shared epochs; the backbone is frozen. Requires
  checkpoints/segmenter_vit_b16_384.pth; no network access.
  --dka-random-init is smoke-only.
