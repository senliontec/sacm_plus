id: dcd
display_name: DCD
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model dcd --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
  --sam-checkpoint checkpoints/sam_vit_l_0b3195.pth
  --bce-weight 0.7 --dice-weight 0.3 --bce-pos-weight 2
  --binary-targets 0 --deploy-threshold 0.5
  --stage2-loss-scope all --topology-head all
  --cl-dice-weight 0.1 --skeleton-recall-weight 0.1
  --specialized-heads 1 --specialized-head-weight 0.1
  --specialized-topology-weight 0.1
  --head-fusion 1 --fusion-loss-weight 1.0
  --topology-resolution 512 --topology-warmup-epochs 5
  --deep-sup-weight 0.3 --head-select gating --deployment-head 3
  --num-workers 0 --save-every 0
  && python scripts/pipeline/make_fixed3_checkpoint.py
  --input {output_root}/best_model.pth
  --output {output_root}/best_model_fixed_candidate.pth
  --deployment-head 3
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method dcd
  --protocol {test_manifest} --seed {seed}
  --checkpoint {output_root}/best_model_fixed_candidate.pth
  --sam-checkpoint checkpoints/sam_vit_l_0b3195.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}/eval
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
  preset: all_dense
note: >-
  Canonical DCD recipe.  The four native Stage-2 heads and the four
  Stage-1 coarse heads are all supervised; soft-clDice and Skeleton Recall
  regularise every Stage-2 candidate; the three auxiliary heads add
  topology / boundary / recall losses; a zero-initialised linear fusion is
  trained as an auxiliary output.  Deployment uses a derived checkpoint with
  head_select=fixed, deployment_head=3 and head_fusion=0, produced by
  scripts/pipeline/make_fixed3_checkpoint.py after training.  The kept
  ablations are native four-head control (--specialized-heads 0),
  no-fusion training (--head-fusion 0), no-topology control
  (--cl-dice-weight 0 --skeleton-recall-weight 0
  --specialized-topology-weight 0), and the dense/structure scope factorial
  (--stage2-loss-scope, --topology-head).  sacm remains the
  independent official baseline.
