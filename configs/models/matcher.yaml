id: matcher
display_name: Matcher
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model matcher --stage train
  --data-root {split_root} --workdir {output_root}
  --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method matcher
  --protocol {test_manifest}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 0
note: >-
  Training-free Matcher (DINOv2 ViT-L/14 + SAM ViT-H), support-based and
  n-shot: DINOv2 patch matching creates target points, the modified SAM
  generator turns them into masks at 518, then predictions are upsampled to
  original GT resolution. The training stage writes a metadata-only
  checkpoint. Requires checkpoints/dinov2_vitl14_pretrain.pth and
  checkpoints/sam_vit_h_4b8939.pth. --matcher-random-init is smoke-only.
  Heavy: local random-init smoke was ~15s/image for 1 support and ~70s/image
  for 3 supports; use --support-shots 1 or a dataset subset for triage.
