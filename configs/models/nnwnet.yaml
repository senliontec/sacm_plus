id: nnwnet
display_name: nnWNet
family: cnn
status: available
checkpoint: "{output_root}/nnunet_model_dir.txt"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model nnwnet --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method nnwnet
  --protocol {test_manifest}
  --seed {seed}
  --data-root {split_root}
  --checkpoint {output_root}/nnunet_model_dir.txt
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Self-contained port of the official nnWNet (CVPR 2025) nnU-Net trainer
  plugin, run through nnunetv2==2.8.1. WNet architecture and 7.04M
  parameters match the paper. Project protocol: fixed 18/6 one-fold split,
  shared 800 epochs, shared Dice/IoU/clDice/HD95 evaluator, and official
  planner/trainer/predictor; predictions exported at GT resolution. The
  paper uses nnU-Net 2.3.1, 200 epochs, 5-fold CV and Jaccard/Dice/95HD/ASD;
  these are documented deviations (nnU-Net is not downgraded because the
  stock nnunet2d baseline shares the 2.8.1 environment). Stale results,
  checkpoints and per-dataset prediction outputs are cleared before reuse.
  `--nnwnet-channels rgb` (default) harmonizes grayscale cases to three
  channels; use `grayscale` for an all-grayscale protocol. A single
  nnU-Net dataset cannot mix 1/3-channel cases.
