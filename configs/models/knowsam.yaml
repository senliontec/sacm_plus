id: knowsam
display_name: KnowSAM
family: sam
status: available
checkpoint: "{output_root}/SGDL_best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model knowsam --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method knowsam
  --protocol {test_manifest}
  --seed {seed}
  --data-root {split_root}
  --checkpoint {output_root}/SGDL_best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 50000
note: >-
  Self-contained official KnowSAM semi-supervised trainer (SAM ViT-B adapter
  + UNet/VNet fusion). Uses 18 labeled images from the protocol and a
  documented source-domain unlabeled pool; oracle-free but semi-supervised.
