id: blo_sam
display_name: BLO-SAM
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model blo_sam --stage train
  --data-root {split_root} --workdir {output_root}
  --blo-sam-checkpoint checkpoints/sam_vit_b_01ec64.pth
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method blo_sam
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 100
note: >-
  Self-contained BLO-SAM port (limited-data bilevel LoRA SAM). SAM ViT-B
  with a frozen image encoder, rank-4 LoRA on the mask-decoder attention
  (official sam_lora_mask_decoder), trainable no-mask prompt embedding and
  mask decoder; 256 input, binary background+foreground head, AdamW
  5e-3/0.1 with prompt optimizer 5e-3/0.1 and the effective per-step
  polynomial LR. The 18 training images are split once into seeded disjoint
  9/9 D1/D2 subsets, stratified across the six pooled domains; prompt
  updates and checkpoint selection use D2, matching the official trainer.
  Official 100-epoch budget. No official BLO-SAM weights; starts from
  sam_vit_b_01ec64.pth.
