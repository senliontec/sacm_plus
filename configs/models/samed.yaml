id: samed
display_name: SAMed
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model samed --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method samed
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Self-contained SAMed port (MICCAI 2023), prompt-free and oracle-free.
  SAM ViT-B with rank-4 q/v LoRA, trainable prompt encoder and class-wise
  mask decoder; binary head; 512 input; CE 0.2 + Dice 0.8 on 128x128
  low-res logits; AdamW 5e-3/0.1 with poly decay. Official Synapse recipe
  adapted to the shared 18-image 3-shot split (batch 4, full 800 epochs).
  Requires checkpoints/sam_vit_b_01ec64.pth; released 8-class SAMed LoRA
  weights are not used.
