id: curvimix
display_name: CurviMix-SAM
family: sam
status: available
checkpoint: "{output_root}/best_model_fixed3.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model curvimix --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
  --sam-checkpoint checkpoints/sam_vit_l_0b3195.pth
  --bce-weight 0.7 --dice-weight 0.3 --bce-pos-weight 2
  --binary-targets 0 --deploy-threshold 0.5
  --stage2-loss-scope all --topology-head all
  --cl-dice-weight 0.1 --skeleton-recall-weight 0.1
  --specialized-heads 1 --specialized-head-weight 0.1
  --specialized-topology-weight 0.1
  --head-fusion 1 --fusion-loss-weight 1.0
  --topology-resolution 512 --topology-warmup-epochs 5
  --deep-sup-weight 0.3 --head-select gating --deployment-head 3
  --adapter-dim-ratio 0.1 --num-workers 0 --save-every 0
  --train-aug mild --copy-paste-prob 0.5
  && python -m baseline_zoo.models.curvimix.derive_fixed3
  --input {output_root}/best_model.pth
  --output {output_root}/best_model_fixed3.pth
  --deployment-head 3
eval_entrypoint: >-
  python -m baseline_zoo.models.curvimix.evaluate
  --data-root {split_root} --protocol {test_manifest}
  --workdir {output_root}
  --checkpoint {output_root}/best_model_fixed3.pth
  --seed {seed} --device cuda:{gpu} --use-wandb 0
protocols: [seeded5, fixed]
defaults:
  epochs: 200
  preset: curvimix
note: >-
  CurviMix-SAM is a self-contained baseline model.  It owns its model code and
  adapter; no SPA-SAM/DCD/SACM model is imported at runtime.  It uses the
  four-candidate scaffold and mild augmentation, and adds
  structure-aware copy-paste: intact curvilinear structures from other
  training images are pasted with flips / rot90 / translation only.  Donors
  come from the training split only.  Deployment is fixed candidate 3 with
  fusion off; copy-paste adds no inference cost.  Ablations:
  --copy-paste-prob 0|0.25|0.5|0.75|1.0 and
  --copy-paste-intensity-match 0|1.  For a budget-matched comparison with
  DCD-800, override --epochs 800.
