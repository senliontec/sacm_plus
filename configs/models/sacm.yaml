id: sacm
display_name: SACM
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model sacm --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method sacm
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Faithful official SACM code. It intentionally preserves the upstream
  correctness defects: no SAM pixel normalization, an all-zero dense prompt
  instead of no_mask_embed, sigmoid-before-softmax fusion, and a 60->800
  stretched schedule. Use this row as the official-code behavior, not as a
  strong method baseline; `dcd` is the separate proposed method,
  not a replacement for this official row.
