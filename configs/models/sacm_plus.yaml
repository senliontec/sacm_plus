id: sacm_plus
display_name: SACM+ (fixed official)
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model sacm_plus --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method sacm_plus
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Corrected SACM variant. It fixes SAM normalization, the no-mask prompt,
  per-block Adapter-E LN, Stage-2 descriptor ordering, branch-repeat and
  weight-decay issues, but it also adds all-head Stage-1/Stage-2 supervision,
  deep supervision and IoU-head selection. Label it as a corrected/
  paper-faithful reimplementation, not as a pure bug fix of the official code.
