id: unet
display_name: U-Net
family: cnn
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model unet --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
  --batch-size 1 --lr 3e-4 --weight-decay 1e-4 --warmup-epochs 20
  --unet-train-mode full --unet-norm instance
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method unet
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
note: >-
  3-shot task-adapted recipe: official milesial U-Net architecture + BCE/Dice
  loss, trained on full native-resolution images (batch 1, no patch
  downsampling), InstanceNorm in place of BatchNorm, AdamW lr=3e-4/wd=1e-4,
  20-epoch warmup + cosine over 300 epochs, joint flips/90-degree rotations
  and mild photometric jitter. BatchNorm's pooled six-domain running
  statistics collapsed eval-mode predictions to all-background; InstanceNorm
  removes that train/eval gap. Label as "3-shot U-Net (official architecture;
  task-adapted InstanceNorm/full-image recipe)". The earlier
  BatchNorm/patch recipe is available as an ablation with
  `--unet-norm batch --unet-train-mode patch --batch-size 8 --lr 1e-3
  --epochs 800 --warmup-epochs 0`.
defaults:
  epochs: 300
