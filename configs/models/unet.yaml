id: unet
display_name: U-Net
family: cnn
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model unet --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method unet
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
note: >-
  Official milesial recipe (per-image scale=0.5, batch 1, RMSprop,
  ReduceLROnPlateau on validation Dice, no augmentation) extended to the
  shared 800-epoch 3-shot budget and 6-image validation split; 1-class
  binary head.
defaults:
  epochs: 800
