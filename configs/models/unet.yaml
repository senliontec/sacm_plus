id: unet
display_name: U-Net
family: cnn
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model unet --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method unet
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
note: >-
  3-shot adapted recipe: official milesial U-Net architecture + BCE/Dice,
  per-image scale=1.0 (native), batch 1, AdamW lr=1e-3/wd=1e-4, cosine
  over 800 epochs, flips/90-degree rotations.  The literal official
  RMSprop 1e-5/ReduceLROnPlateau recipe collapsed the LR to 1e-8 by
  epoch 19 on 18 images; label as "3-shot U-Net (official architecture;
  adapted recipe)".
defaults:
  epochs: 800
