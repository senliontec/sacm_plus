id: medcagd
display_name: MedCAGD
family: cnn
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model medcagd --stage train
  --data-root {split_root} --workdir {output_root}
  --medcagd-input-policy patches --medcagd-use-stage0 0
  --medcagd-dice-weight 1.0
  --medcagd-encoder-weights checkpoints/pvt_v2_b2.in1k.safetensors
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method medcagd
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Self-contained MedCAGD binary port (ECCV 2026, MIT). Context-aware gated
  decoder with PVTv2-B2 encoder, deep supervision and edge supervision.
  The paper uses 256x256/stride-128 patches for DRIVE/FIVES and 224x224
  full images for its large-object benchmarks. All protocol datasets are
  thin curvilinear structures, so the default task adaptation applies the
  DRIVE/FIVES patch recipe to every dataset (training crops and
  overlapping-patch inference). Pass --medcagd-input-policy paper to
  reproduce the paper's 224-full/256-patch dataset mapping. The shared
  18-image 3-shot split replaces the upstream patch directories. The
  raw-image Stage 0 path is disabled by default because the paper's final
  model excludes it (--medcagd-use-stage0 1 reproduces the code variant).
  The paper uses BCE only; this port adds a soft Dice term on the main
  output (weight 1.0) because BCE-only training collapses to all background
  on the 0.25-3% foreground domains. Set --medcagd-dice-weight 0 for
  BCE-only. The upstream Albumentations/CutMix recipe and CuPy evaluator
  are not used. No official
  trained checkpoint is present; training initializes the encoder from the
  local timm `pvt_v2_b2.in1k` weights at
  checkpoints/pvt_v2_b2.in1k.safetensors (download the 101 MB
  model.safetensors from https://huggingface.co/timm/pvt_v2_b2.in1k on a
  networked machine and rename it; runtime never accesses the network).
