id: medcagd
display_name: MedCAGD
family: cnn
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model medcagd --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method medcagd
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Self-contained MedCAGD binary port (ICML 2026, MIT). Context-aware gated
  decoder with PVTv2-B2 encoder, deep supervision and edge supervision,
  trained on 256x256 crops. The shared 18-image 3-shot split replaces the
  upstream DRIVE patch split; full-resolution test images are evaluated with
  overlapping 256 patches (stride 128). The upstream Albumentations/CutMix
  recipe and CuPy evaluator are not used. No official trained checkpoint is
  present; ImageNet encoder initialization is used for training.
