id: dconnnet
display_name: DconnNet
family: cnn
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model dconnnet --stage train
  --data-root {split_root} --workdir {output_root}
  --batch-size 4 --lr 0.0038 --input-size 960
  --dconnnet-backbone-ckpt checkpoints/resnet34-333f7ec4.pth
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method dconnnet
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  DconnNet (CVPR 2023), non-SAM directional-connectivity segmenter.
  Official CHASE recipe: 960x960 BGR, [0,1]*3.2-1.6, 8-direction
  connectivity head, BCE + connectivity BCE + edge + Dice, Adam 3.8e-3,
  polynomial LR 0.9; shared 800-epoch budget and validation-Dice selection.
  Batch 4 on 24 GiB GPUs; fp32 (no apex). The ResNet-34 ImageNet backbone is
  loaded from checkpoints/resnet34-333f7ec4.pth if present; otherwise the
  run is from random initialization and marked as a deviation. Inference uses
  sigmoid -> 0.5 -> Bilateral_voting -> max and exact GT-size export.
