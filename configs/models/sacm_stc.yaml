id: sacm_stc
display_name: SACM-STC
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model sacm_stc --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
  --use-typed-stage2 0 --use-stc 0
  --deep-sup-weight 0.3 --iou-loss-weight 0
  --head-select gating
  --skeleton-recall-weight 0.1 --cl-dice-weight 0.1
  --topology-head all --topology-warmup-epochs 5
  --binary-targets 0 --bce-pos-weight 2
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method sacm_stc
  --protocol {test_manifest}
  --seed {seed}
  --variant {preset}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
  preset: all_dense
note: >-
  SACM-STC (all-dense geometry variant): keeps the official four-candidate
  Stage-2 structure, where every native mask token predicts a dense mask and
  the Stage-1 gating order selects the deployment candidate. On top of that
  it adds (1) dense deep supervision on the four Stage-1 coarse heads,
  (2) Skeleton Recall and soft-clDice consistency on all four Stage-2 dense
  candidates, (3) soft bilinear targets and (4) foreground-weighted BCE.
  The network and the official SACM row are unchanged; the geometry losses
  are consistency terms on the evaluated dense masks, not a test-time head
  selector. This replaces the earlier typed-head prototype because the
  specialized heads removed the official multi-candidate robustness; see
  the local A/B evidence in the adapter deviations and results/diagnostics.
  The faithful official SACM remains the main-table baseline
  (`sacm_official`).
