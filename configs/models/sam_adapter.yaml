id: sam_adapter
display_name: SAM-Adapter
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model sam_adapter --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method sam_adapter
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Self-contained port of SAM-Adapter (ICCV 2023), ViT-L, prompt-free.
  The official FFT high-pass prompt generator is injected into every ViT
  block; the decoder receives empty sparse prompts plus no_mask_embed.
  Official AdamW 2e-4/cosine recipe extended from 20 to the 800-epoch
  3-shot budget; the prompt generator, mask decoder, and the prompt
  encoder's pe_layer/no_mask_embed are trained (matching the official
  freeze loop).
  Official batch size is 2; this port defaults to batch 1 + 2-step
  accumulation + gradient checkpointing to fit a 24 GiB card, preserving
  effective batch 2.
