id: bcunet
display_name: BCUNet
family: cnn
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model bcunet --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method bcunet
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  Upstream OutConv referenced an undefined upconv2x2 and main.py imports a
  missing warmlearnrate.py; both are repaired as a 1x1 logits projection
  and the unified training loop. The original final block cannot be
  recovered from the release or a local paper, so this row is a
  reconstructed BCU-Net variant, not verified end-to-end release parity.
