id: bcunet
display_name: BCUNet
family: cnn
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  python -m baseline_zoo.run_one --model bcunet --stage train
  --data-root {split_root} --workdir {output_root}
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  python scripts/pipeline/run_baseline_test.py --method bcunet
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  The paper's U-Net branch uses four normal upsampling blocks and sends its
  final feature map to MRL fusion; no extra upconv2x2/BN/sigmoid is
  specified. The release's undefined upconv2x2 and missing
  warmlearnrate.py are replaced by a CE-compatible 1x1 logits projection
  and the unified training loop. No official BCU-Net weights are released
  or needed: this row trains from scratch on the shared split, with only
  the ConvNeXt ImageNet backbone pretrained. Label the OutConv as a
  reconstructed component, not as official code.
