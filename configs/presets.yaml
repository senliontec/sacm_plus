# Preset definitions live in Python: src/models/sacm_x/configs.py (PRESETS).
# This file only selects a preset and optionally overrides argparse values.
#
# Usage:
#   python src/train/trainer.py --preset full --config configs/presets.yaml
#   python src/eval/evaluate.py --preset full --config configs/presets.yaml
#
# Any top-level key below overrides the selected preset/CLI value.
preset: full

# Examples (uncomment to override):
# use_geo_i: false
# use_geo_e: false
# epochs: 30
# pred_threshold: 0.5

# SCNP (Same-Class Neighbor Penalization, CVPR 2026) — training-only
# logit transform. Official SCNP(CEDice): only the transformed logits
# feed BCE/Dice; set scnp_original_weight > 0 to add the raw-logit term.
# Equivalent one-flag preset: `--preset full_scnp`.
# scnp: true
# scnp_window: 3
# scnp_original_weight: 0.0
