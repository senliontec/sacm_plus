# Optuna search spaces for the paper baselines.
#
# Relative factors are multiplied by the adapter's official_lr /
# official_weight_decay.  The runner uses the 6-image validation Dice for
# model selection; the test split is never used.
defaults:
  tunable: true
  lr:
    type: loguniform
    low_factor: 0.2
    high_factor: 5.0
  weight_decay:
    type: loguniform
    low_factor: 0.1
    high_factor: 10.0
  scheduler:
    choices: [official, constant, cosine, poly, onecycle]
  warmup_epochs:
    choices: [0, 5, 10, 20, 50]

models:
  # The official U-Net recipe uses ReduceLROnPlateau on validation Dice;
  # generic epoch-scheduler/warmup overrides would replace it.
  unet:
    scheduler:
      choices: [official]
    warmup_epochs:
      choices: [0]

  # Iteration-based custom trainer; its internal optimizers/schedulers are
  # not covered by the shared --scheduler/--warmup-epochs interface yet.
  nnwnet:
    tunable: false
  knowsam:
    tunable: false

  # Training-free methods have no LR to tune.
  matcher:
    tunable: false
  persam:
    tunable: false

  # BLO-SAM's custom train_epoch owns a per-step polynomial LR for the
  # network and prompt optimizers.  The shared per-epoch scheduler/warmup
  # overrides are not wired into that loop, so keep them at the official
  # setting instead of reporting mislabelled trials.
  blo_sam:
    scheduler:
      choices: [official]
    warmup_epochs:
      choices: [0]

  # SAMed's paper LR 5e-3 is for batch 24; the adapted batch-4 default is
  # 1e-3.  Search below the paper value as well: collapse at the warmup peak
  # was observed at the unscaled 5e-3.
  samed:
    lr:
      type: loguniform
      low: 0.0001
      high: 0.005
    extra:
      samed_bg_weight:
        choices: [0.05, 0.1, 0.2]
      samed_aux_weight:
        choices: [0.0, 0.5]
      samed_cldice_weight:
        choices: [0.0, 0.1, 0.2]
      samed_oversample:
        choices: [0, 1]
      samed_high_res_head:
        choices: [0, 1]

  # DSCNet's empty-prediction failure is sensitive to the added Dice term.
  dscnet:
    extra:
      dsc_dice_weight:
        choices: [0.0, 0.5, 1.0, 2.0]

  # SAM-OCTA's optimizer has a nominal 1.0 LR and scales it through its
  # scheduler; the generic scheduler sets the effective base to --lr.
  sam_octa:
    lr:
      type: loguniform
      low_factor: 0.2
      high_factor: 3.0
