id: nativetok
display_name: NativeToken
family: sam
status: available
checkpoint: "{output_root}/best_model.pth"
train_entrypoint: >-
  SACM_ENABLE_PROJECT_MODELS=1 python -m baseline_zoo.run_one
  --model nativetok --stage train
  --data-root {split_root} --workdir {output_root}
  --convlora-model-type vit_b
  --convlora-checkpoint checkpoints/sam_vit_b_01ec64.pth
  --nativetok-scales 8 4
  --nativetok-hidden 32
  --nativetok-alpha-init 0
  --nativetok-new-lr-mult 10
  --nativetok-native-max-side 0
  --epochs {epochs} --seed {seed} --device cuda:{gpu} --use_wandb
eval_entrypoint: >-
  SACM_ENABLE_PROJECT_MODELS=1 python
  scripts/pipeline/run_baseline_test.py --method nativetok
  --protocol {test_manifest}
  --seed {seed}
  --checkpoint {output_root}/best_model.pth
  --pred-root {output_root}/predictions
  --paper-root {output_root}
  --device cuda:{gpu} --use_wandb true --skip-visualize
protocols: [seeded5, fixed]
defaults:
  epochs: 800
note: >-
  New project model, not an official baseline. Keeps Conv-LoRA's qkv LoRA,
  multi-scale conv MoE, prompt-free decoder, structure loss and MoE loss.
  Adds a native-resolution residual tokenizer at SAM patch_embed: coarse
  tokens gate fine scales (8/4 in 1024 pixels), fine patches are sampled
  from the original-resolution image at token centres, embedded with a
  frozen copy of the SAM patch-embedding convolution, and added with a
  zero-initialized scalar residual. No extra ViT pass, token, decoder,
  loss, SACM adapter, style conditioning or fusion module. ViT-B is the
  local 11 GiB profile; ViT-H/L can be selected for the 24 GiB server.
  The official `convlora` baseline remains unmodified.
