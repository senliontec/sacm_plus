# Five seed-based 3-shot splits.  The Seen test set is part of each
# complete split; Unseen/Novel test roots are shared external datasets.
name: seeded5
description: Five seed-based 3-shot splits (seeds 0-4)
seeds: [0, 1, 2, 3, 4]
split_root: data/sacm_3shot_seed{seed}
train_manifest: data/sacm_3shot_seed{seed}/split_manifest.csv
test_manifest: data/sacm_3shot_seed{seed}/protocol_manifest.csv
