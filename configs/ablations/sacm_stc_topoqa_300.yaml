# TopoQA screen (300 epochs, seed 0, paired schedule).
#
# Every arm uses the canonical SSH full recipe and the same schedule.  The
# main paired contrast is control vs topoqa: both keep linear head fusion and
# differ only by the quality head + Pareto arbitration.  topoqa_quality
# isolates the quality loss (no selection change); topoqa_sel disables fusion
# to test the SAM-style "select, don't average" hypothesis and is a separate
# two-factor diagnostic, not the main contrast.
schema_version: 1
name: sacm_stc_topoqa_300
description: >-
  300-epoch TopoQA screen: role-aware IoU/soft-clDice quality calibration and
  Pareto arbitration on the four native Stage-2 experts.
protocol: seeded5
method: sacm_stc
seeds: [0]
epochs: 300
eval_checkpoint: best_model.pth
expected_datasets: 20
output_root: results/runs/sacm_stc_topoqa_300

wandb:
  project: sacm
  entity: buaazqk
  group: sacm_stc_topoqa_300
  tags: sacm_stc,topoqa,300ep
  use_wandb: true

common_train_args:
  sam-checkpoint: checkpoints/sam_vit_l_0b3195.pth
  bce-weight: 0.7
  dice-weight: 0.3
  bce-pos-weight: 2
  binary-targets: 0
  deploy-threshold: 0.5
  # canonical full recipe (identical for every arm)
  stage2-loss-scope: all
  stage2-loss-aggregate: deployment
  stage2-aux-weight: 0.25
  topology-head: all
  topology-aggregate: deployment
  topology-aux-weight: 0.25
  topology-resolution: 512
  topology-source: native
  topology-warmup-epochs: 5
  cl-dice-weight: 0.1
  skeleton-recall-weight: 0.1
  deep-sup-weight: 0.3
  iou-loss-weight: 0
  head-select: gating
  deployment-head: 2
  use-stc: 0
  use-typed-stage2: 0
  head-fusion-mode: linear
  head-fusion-warmup-epochs: 0
  specialized-topology-mode: cldice
  # TPD / POMP / old quality paths stay off
  image-dense-prompt: 0
  image-dense-prompt-mode: residual
  morph-prompt: 0
  morph-prompt-gate-threshold: 0.1
  polarity-augment: 0
  polarity-augment-prob: 0.5
  topology-quality: 0
  quality-loss-weight: 0.1
  quality-iou-weight: 0.34
  quality-dice-weight: 0.33
  quality-cldice-weight: 0.33
  quality-resolution: 64
  quality-warmup-epochs: 5
  quality-refine: 0
  quality-refine-topk: 2
  quality-refine-threshold: 0.7
  quality-refine-weight: 0.5
  quality-refine-stage1: 0
  quality-refine-min-score-ratio: 0.5
  quality-select-margin: 0.01
  # TopoQA defaults (off; arms override)
  topoqa: 0
  topoqa-quality-weight: 0.1
  topoqa-rank-weight: 0.1
  topoqa-temperature: 0.1
  topoqa-resolution: 256
  topoqa-warmup-epochs: 20
  topoqa-detach: 1
  topoqa-arbitration: pareto
  topoqa-margin-cldice: 0.01
  topoqa-margin-iou: 0.005
  topoqa-stability-delta: 0.1
  topoqa-stability-threshold: 0.9
  topoqa-alpha: 0.5
  topoqa-hidden: 64
  topoqa-role-dim: 16
  topoqa-skeleton-iters: 5
  save-every: 0
  num-workers: 0

arms:
  control:
    display_name: SSH default (no TopoQA)
    args:
      specialized-heads: 1
      specialized-head-weight: 0.1
      head-fusion: 1
      fusion-loss-weight: 1.0
  topoqa:
    display_name: TopoQA quality + Pareto arbitration
    args:
      specialized-heads: 1
      specialized-head-weight: 0.1
      head-fusion: 1
      fusion-loss-weight: 1.0
      topoqa: 1
      topoqa-arbitration: pareto
  topoqa_quality:
    display_name: TopoQA quality loss only (gating selection)
    args:
      specialized-heads: 1
      specialized-head-weight: 0.1
      head-fusion: 1
      fusion-loss-weight: 1.0
      topoqa: 1
      topoqa-arbitration: none
  topoqa_sel:
    display_name: TopoQA Pareto selection without fusion
    args:
      specialized-heads: 1
      specialized-head-weight: 0.1
      head-fusion: 0
      fusion-loss-weight: 1.0
      topoqa: 1
      topoqa-arbitration: pareto

contrasts:
  - id: topoqa_minus_control
    left: topoqa
    right: control
    label: TopoQA quality + Pareto vs SSH
  - id: topoqa_quality_minus_control
    left: topoqa_quality
    right: control
    label: quality loss only vs SSH
  - id: topoqa_sel_minus_control
    left: topoqa_sel
    right: control
    label: Pareto selection without fusion vs SSH

analysis:
  output_root: results/ablations/sacm_stc_topoqa_300/analysis
  primary_metric: dice
  primary_role: All
  metrics:
  - dice
  - iou
  - cldice
  - hd95
  datasets:
  - CHASEDB1
  - CHCrack5k
  - CORN
  - CREMI
  - CrackTree200
  - DCA1
  - DRIVE
  - DeepCrack
  - DeepGlobe
  - FIVES
  - HRF
  - LEAF
  - LES-AV
  - OCTA-500
  - ROAD
  - STARE
  - TYRE
  - TopoMortar
  - WIRE
  - XCAD
  require_train_complete: true
  require_eval_complete: true
  bootstrap_samples: 2000
  seed: 20261111
