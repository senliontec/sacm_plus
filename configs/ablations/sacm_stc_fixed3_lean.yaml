# Lean fixed3 ablation: the three 800-epoch arms attached to the best model.
#
#   fixed3          -> existing 4-seed eval tables (derived from ssh)
#   gating + fusion -> existing ssh checkpoint, eval only
#   nofusion        -> trained here, fixed H3 eval
#   native_control  -> trained here, eval as-is (gating)
#   notopo          -> trained here, fixed H3 eval
#
# Only the named factor changes; all shared arguments stay identical.
schema_version: 1
name: sacm_stc_fixed3_lean
description: >-
  Lean fixed3 ablation: no-fusion training, native four-head control, and
  no-topology supervision at the shared 800-epoch budget.
protocol: seeded5
method: sacm_stc
seeds: [0, 1, 2, 3]
epochs: 800
eval_checkpoint: best_model.pth
expected_datasets: 20
output_root: results/runs/sacm_stc_fixed3_lean

wandb:
  project: sacm
  entity: buaazqk
  group: sacm_stc_fixed3_lean
  tags: sacm_stc,ablation,fixed3,lean,800ep
  use_wandb: true

common_train_args:
  sam-checkpoint: checkpoints/sam_vit_l_0b3195.pth
  bce-weight: 0.7
  dice-weight: 0.3
  bce-pos-weight: 2
  binary-targets: 0
  deploy-threshold: 0.5
  stage2-loss-scope: all
  topology-head: all
  topology-resolution: 512
  topology-warmup-epochs: 5
  cl-dice-weight: 0.1
  skeleton-recall-weight: 0.1
  specialized-head-weight: 0.1
  specialized-topology-weight: 0.1
  deep-sup-weight: 0.3
  head-select: gating
  deployment-head: 3
  save-every: 0
  num-workers: 0

arms:
  nofusion:
    display_name: specialised heads without fusion
    args:
      specialized-heads: 1
      head-fusion: 0
      fusion-loss-weight: 0.0

  native_control:
    display_name: native four heads, no role-specialised losses
    args:
      specialized-heads: 0
      head-fusion: 0
      fusion-loss-weight: 0.0

  notopo:
    display_name: specialised heads without topology supervision
    args:
      specialized-heads: 1
      head-fusion: 1
      fusion-loss-weight: 1.0
      cl-dice-weight: 0.0
      skeleton-recall-weight: 0.0
      specialized-topology-weight: 0.0

analysis:
  output_root: results/ablations/sacm_stc_fixed3_lean/analysis
  primary_metric: cldice
  primary_role: All
  metrics: [dice, iou, cldice, hd95]
  datasets:
    - CHASEDB1
    - CHCrack5k
    - CORN
    - CREMI
    - CrackTree200
    - DCA1
    - DRIVE
    - DeepCrack
    - DeepGlobe
    - FIVES
    - HRF
    - LEAF
    - LES-AV
    - OCTA-500
    - ROAD
    - STARE
    - TYRE
    - TopoMortar
    - WIRE
    - XCAD
  bootstrap_samples: 2000
  seed: 20261112
