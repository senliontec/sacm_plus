# Paired 300-epoch head A/B: native full recipe vs specialized heads + fusion.
#
# Both arms are trained from scratch with the same seed, data, 300-epoch
# official cosine schedule and every shared argument.  The only difference is
# the four-head strategy:
#   control : native four Stage-2 heads, canonical all-dense / all-head losses
#   ssh     : same backbone/losses + specialized head losses (clDice /
#             boundary / recall) + zero-initialised safe head fusion
#
# This is the fast screening pair for "is the new four-head scheme better than
# sacm_stc full?".  A positive result must be confirmed with the 800-epoch
# full-budget pair; a negative result stops the idea early.
schema_version: 1
name: sacm_stc_headab_300
description: >-
  Same-seed, same-recipe 300-epoch pair: native sacm_stc full vs
  specialized-heads + safe fusion.  Only the four-head strategy differs.
protocol: seeded5
method: sacm_stc
seeds: [0, 1, 2, 3]
epochs: 300
eval_checkpoint: best_model.pth
expected_datasets: 20
# Engineering-only inversion override: OFF by default. Uncomment the two
# lines below for an explicit deployment run, and apply the same override to
# every model in that comparison. This is not a method contribution.
# eval_invert_datasets: [TopoMortar, DeepGlobe, LEAF]
# eval_invert_threshold: 0.2
output_root: results/runs/sacm_stc_headab_300

wandb:
  project: sacm
  entity: buaazqk
  group: sacm_stc_headab_300
  tags: sacm_stc,headab,300ep
  use_wandb: true

common_train_args:
  sam-checkpoint: checkpoints/sam_vit_l_0b3195.pth
  bce-weight: 0.7
  dice-weight: 0.3
  bce-pos-weight: 2
  binary-targets: 0
  deploy-threshold: 0.5
  # canonical full recipe (identical for both arms)
  stage2-loss-scope: all
  stage2-loss-aggregate: deployment
  stage2-aux-weight: 0.25
  topology-head: all
  topology-aggregate: deployment
  topology-aux-weight: 0.25
  topology-resolution: 512
  topology-source: native
  topology-warmup-epochs: 5
  cl-dice-weight: 0.1
  skeleton-recall-weight: 0.1
  deep-sup-weight: 0.3
  iou-loss-weight: 0
  head-select: gating
  deployment-head: 2
  use-stc: 0
  use-typed-stage2: 0
  # TPD / POMP stay off in both arms
  image-dense-prompt: 0
  image-dense-prompt-mode: residual
  morph-prompt: 0
  morph-prompt-gate-threshold: 0.1
  polarity-augment: 0
  polarity-augment-prob: 0.5
  topology-quality: 0
  quality-loss-weight: 0.1
  quality-iou-weight: 0.34
  quality-dice-weight: 0.33
  quality-cldice-weight: 0.33
  quality-resolution: 64
  quality-warmup-epochs: 5
  quality-refine: 0
  quality-refine-topk: 2
  quality-refine-threshold: 0.7
  quality-refine-weight: 0.5
  quality-refine-stage1: 0
  quality-refine-min-score-ratio: 0.5
  quality-select-margin: 0.01
  save-every: 0
  num-workers: 0

arms:
  control:
    display_name: sacm_stc full native four heads (control)
    args:
      specialized-heads: 0
      head-fusion: 0
  ssh:
    display_name: sacm_stc full + specialized heads + safe fusion
    args:
      specialized-heads: 1
      specialized-head-weight: 0.1
      head-fusion: 1
      fusion-loss-weight: 1.0

contrasts:
  - id: ssh_minus_control
    left: ssh
    right: control
    label: specialized heads + safe fusion vs native four heads

analysis:
  output_root: results/ablations/sacm_stc_headab_300/analysis
  primary_metric: dice
  primary_role: All
  metrics:
  - dice
  - iou
  - cldice
  - hd95
  datasets:
  - CHASEDB1
  - CHCrack5k
  - CORN
  - CREMI
  - CrackTree200
  - DCA1
  - DRIVE
  - DeepCrack
  - DeepGlobe
  - FIVES
  - HRF
  - LEAF
  - LES-AV
  - OCTA-500
  - ROAD
  - STARE
  - TYRE
  - TopoMortar
  - WIRE
  - XCAD
  require_train_complete: true
  require_eval_complete: true
  bootstrap_samples: 2000
  seed: 20261111
