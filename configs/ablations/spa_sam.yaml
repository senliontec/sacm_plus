# SPA-SAM ablation matrix.
#
# The executable driver is scripts/run_spa_sam_ablation.sh.  This file is the
# canonical description of the variants so the paper tables and the driver
# stay in sync.
id: spa_sam_ablation
model: spa_sam
epochs: 800
seeds: [0, 1, 2, 3]
deployment:
  head_select: fixed
  deployment_head: 3
  head_fusion: 0
variants:
  aug_none:
    train_aug: none
    description: DCD control with no augmentation.
  aug_flip:
    train_aug: flip
    description: Synchronized horizontal/vertical flips only.
  aug_photo:
    train_aug: photo
    description: Photometric perturbations only.
  aug_mild:
    train_aug: mild
    description: Flips + photometric; canonical SPA-SAM recipe.
  aug_strong:
    train_aug: strong
    description: Mild + 90-degree rotations + mild blur.
  # Destructive negative controls: these should hurt clDice/HD95 and are
  # evidence that structure-preserving augmentation is necessary.
  aug_crop:
    train_aug: crop
    description: Random resized crop; destroys thin curvilinear continuity.
  aug_elastic:
    train_aug: elastic
    description: Smooth random elastic displacement; topology-destroying control.
  aug_cutout:
    train_aug: cutout
    description: Random rectangular image erasing; occlusion control.
  aug_standard:
    train_aug: standard
    description: Arbitrary rotation + random crop + strong photometric + blur.
  # Intensity/probability controls for the canonical augmentation policy.
  aug_mild_p25:
    train_aug: mild
    extra_args: "--aug-flip-prob 0.25"
    description: Lower flip probability.
  aug_mild_p75:
    train_aug: mild
    extra_args: "--aug-flip-prob 0.75"
    description: Higher flip probability.
  aug_photo_half:
    train_aug: photo
    extra_args: "--aug-photo-strength 0.5"
    description: Half-strength photometric perturbation.
  aug_photo_2x:
    train_aug: photo
    extra_args: "--aug-photo-strength 2.0"
    description: Double-strength photometric perturbation.
  aug_noise0:
    train_aug: mild
    extra_args: "--aug-noise-std 0"
    description: Remove Gaussian noise from the canonical mild policy.
  no_specialized:
    train_aug: mild
    extra_args: "--specialized-heads 0"
    description: Native four-head control under mild augmentation.
  no_fusion:
    train_aug: mild
    extra_args: "--head-fusion 0"
    description: No-fusion training under mild augmentation.
  no_topology:
    train_aug: mild
    extra_args: "--cl-dice-weight 0 --skeleton-recall-weight 0 --specialized-topology-weight 0"
    description: No topology losses under mild augmentation.
  dense_selected:
    train_aug: mild
    extra_args: "--stage2-loss-scope selected"
    description: Dense loss only on the selected deployment head.
  topo_deployment:
    train_aug: mild
    extra_args: "--topology-head deployment"
    description: Topology loss only on the fixed deployment head.
