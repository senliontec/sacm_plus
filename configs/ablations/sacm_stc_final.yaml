# Final SACM-STC rerun configuration.
#
# This file is the frozen protocol for the final paper run.  It deliberately
# uses new variant names under the canonical SACM-STC tree:
#
#   results/runs/sacm_stc/final_full/seed_<s>
#   results/runs/sacm_stc/final_sel_sel/seed_<s>
#   ...
#
# The previous all_dense / selected / b* / das_* directories are never
# overwritten.  Keeping the canonical parent is required: run_baseline_test
# only publishes eval tables when the run root is
# results/runs/<method>/<variant>/seed_<s>, and pull_results.sh uses the same
# layout.
#
# The 2 x 3 factorial is:
#   dense scope:     selected / all
#   structure scope: none / selected / all
# plus one uniform-aggregation control for the full all/all arm.
#
# Do not use --stage all with this config: that path always runs candidate
# diagnostics.  scripts/run_sacm_stc_final.sh runs train -> eval -> analyze.
schema_version: 1
name: sacm_stc_final
description: >-
  Frozen final SACM-STC protocol: full model plus the complete 2 x 3
  dense-scope x structure-scope factorial, with a uniform-aggregation control.
protocol: seeded5
method: sacm_stc
seeds: [0, 1, 2, 3]
epochs: 800
eval_checkpoint: best_model.pth
expected_datasets: 20
output_root: results/runs/sacm_stc

wandb:
  project: sacm
  entity: buaazqk
  group: sacm_stc_final
  tags: sacm_stc,final,full,ablation
  use_wandb: true

# Applied to every arm.  Arm-specific args override these values.
common_train_args:
  sam-checkpoint: checkpoints/sam_vit_l_0b3195.pth
  bce-weight: 0.7
  dice-weight: 0.3
  bce-pos-weight: 2
  binary-targets: 0
  deploy-threshold: 0.5
  deep-sup-weight: 0.3
  iou-loss-weight: 0
  head-select: gating
  deployment-head: 2
  topology-resolution: 512
  topology-warmup-epochs: 5
  stage2-loss-aggregate: deployment
  stage2-aux-weight: 0.25
  topology-aggregate: deployment
  topology-aux-weight: 0.25
  use-stc: 0
  use-typed-stage2: 0
  save-every: 0
  num-workers: 0

arms:
  # Full model: all dense candidates + all topology candidates.
  final_full:
    display_name: SACM-STC full (all dense + all topology, deployment)
    args:
      stage2-loss-scope: all
      topology-head: all
      stage2-loss-aggregate: deployment
      topology-aggregate: deployment
      cl-dice-weight: 0.1
      skeleton-recall-weight: 0.1

  # Selected/selected baseline.
  final_sel_sel:
    display_name: selected dense + selected topology
    args:
      stage2-loss-scope: selected
      topology-head: selected
      cl-dice-weight: 0.1
      skeleton-recall-weight: 0.1

  # Selected dense + all topology.
  final_sel_all:
    display_name: selected dense + all topology
    args:
      stage2-loss-scope: selected
      topology-head: all
      topology-aggregate: deployment
      cl-dice-weight: 0.1
      skeleton-recall-weight: 0.1

  # All dense + selected topology.
  final_all_sel:
    display_name: all dense + selected topology (deployment)
    args:
      stage2-loss-scope: all
      topology-head: selected
      stage2-loss-aggregate: deployment
      cl-dice-weight: 0.1
      skeleton-recall-weight: 0.1

  # All dense + all topology, uniform aggregation control.
  final_all_all_mean:
    display_name: all dense + all topology (uniform control)
    args:
      stage2-loss-scope: all
      topology-head: all
      stage2-loss-aggregate: mean
      topology-aggregate: mean
      cl-dice-weight: 0.1
      skeleton-recall-weight: 0.1

  # No-structure controls for the 2 x 3 factorial.
  final_sel_none:
    display_name: selected dense, no topology
    args:
      stage2-loss-scope: selected
      topology-head: selected
      cl-dice-weight: 0.0
      skeleton-recall-weight: 0.0

  final_all_none:
    display_name: all dense, no topology
    args:
      stage2-loss-scope: all
      topology-head: selected
      stage2-loss-aggregate: deployment
      cl-dice-weight: 0.0
      skeleton-recall-weight: 0.0

contrasts:
  - id: full_minus_selected
    left: final_full
    right: final_sel_sel
    label: full all/all vs selected/selected
  - id: full_minus_all_mean
    left: final_full
    right: final_all_all_mean
    label: deployment vs uniform aggregation for all/all
  - id: full_minus_all_sel
    left: final_full
    right: final_all_sel
    label: topology scope selected -> all under all dense
  - id: all_sel_minus_selected
    left: final_all_sel
    right: final_sel_sel
    label: dense scope selected -> all with selected topology
  - id: sel_all_minus_selected
    left: final_sel_all
    right: final_sel_sel
    label: topology scope selected -> all with selected dense
  - id: all_none_minus_sel_none
    left: final_all_none
    right: final_sel_none
    label: dense scope selected -> all without topology
  - id: all_sel_minus_all_none
    left: final_all_sel
    right: final_all_none
    label: add selected topology under all dense
  - id: full_minus_all_none
    left: final_full
    right: final_all_none
    label: add all topology and deployment aggregation under all dense

analysis:
  output_root: results/ablations/sacm_stc_final/analysis
  primary_metric: dice
  primary_role: All
  metrics: [dice, iou, cldice, hd95]
  # Primary paper analysis is the balanced 15-dataset subset
  # (5 Seen / 5 Unseen / 5 Novel).  The 20-dataset eval remains complete for
  # provenance, but the paired tables are recomputed on this subset.
  datasets:
    - CHASEDB1
    - CrackTree200
    - CREMI
    - DCA1
    - DRIVE
    - CHCrack5k
    - FIVES
    - HRF
    - LES-AV
    - OCTA-500
    - DeepGlobe
    - ROAD
    - TopoMortar
    - TYRE
    - WIRE
  require_train_complete: true
  require_eval_complete: true
  bootstrap_samples: 2000
  seed: 20261110
