# SACM-STC SSH debug run (200 epochs).
#
# Debug-only clone of `sacm_stc_tpd_full.yaml`: the training recipe and every
# shared argument are identical to the canonical full recipe
# (all-dense Stage-2, all-head topology, deployment aggregation, clDice /
# skeleton 0.1, deep-sup 0.3, 3e-4, official cosine).  Only the epoch budget
# is reduced to 200 and only the `ssh` arm is enabled, so a debugging signal
# costs ~2 h instead of ~7.5 h.
#
# This run is NOT the final comparison.  The final claim must use the
# 800-epoch full-budget run against the archived `sacm_stc full` control.
schema_version: 1
name: sacm_stc_ssh_debug200
description: >-
  Debug-only 200-epoch SSH run on the canonical full recipe; not a final
  effectiveness comparison.
protocol: seeded5
method: sacm_stc
seeds: [0, 1, 2, 3]
epochs: 200
eval_checkpoint: best_model.pth
expected_datasets: 20
# Engineering-only inversion override: OFF by default. Uncomment the two
# lines below for an explicit deployment run, and apply the same override to
# every model in that comparison. This is not a method contribution.
# eval_invert_datasets: [TopoMortar, DeepGlobe, LEAF]
# eval_invert_threshold: 0.2
output_root: results/runs/sacm_stc_ssh_debug200

wandb:
  project: sacm
  entity: buaazqk
  group: sacm_stc_ssh_debug200
  tags: sacm_stc,ssh,debug,200ep
  use_wandb: true

common_train_args:
  sam-checkpoint: checkpoints/sam_vit_l_0b3195.pth
  bce-weight: 0.7
  dice-weight: 0.3
  bce-pos-weight: 2
  binary-targets: 0
  deploy-threshold: 0.5
  # canonical full recipe
  stage2-loss-scope: all
  stage2-loss-aggregate: deployment
  stage2-aux-weight: 0.25
  topology-head: all
  topology-aggregate: deployment
  topology-aux-weight: 0.25
  topology-resolution: 512
  topology-source: native
  topology-warmup-epochs: 5
  cl-dice-weight: 0.1
  skeleton-recall-weight: 0.1
  deep-sup-weight: 0.3
  iou-loss-weight: 0
  head-select: gating
  deployment-head: 2
  use-stc: 0
  use-typed-stage2: 0
  # Same common block as sacm_stc_tpd_full.yaml; the ssh arm switches the
  # TPD pieces off, exactly like the full config's ssh arm.
  image-dense-prompt: 1
  image-dense-prompt-mode: residual
  morph-prompt: 0
  morph-prompt-gate-threshold: 0.1
  polarity-augment: 0
  polarity-augment-prob: 0.5
  topology-quality: 1
  quality-loss-weight: 0.1
  quality-iou-weight: 0.34
  quality-dice-weight: 0.33
  quality-cldice-weight: 0.33
  quality-resolution: 64
  quality-warmup-epochs: 5
  quality-refine: 1
  quality-refine-topk: 2
  quality-refine-threshold: 0.7
  quality-refine-weight: 0.5
  quality-refine-stage1: 1
  quality-refine-min-score-ratio: 0.5
  quality-select-margin: 0.01
  save-every: 0
  num-workers: 0

arms:
  ssh:
    display_name: SACM-STC full + structure-specialized heads + safe fusion (debug 200ep)
    args:
      image-dense-prompt: 0
      topology-quality: 0
      quality-refine: 0
      quality-refine-stage1: 0
      specialized-heads: 1
      specialized-head-weight: 0.1
      head-fusion: 1
      fusion-loss-weight: 1.0

contrasts: []

analysis:
  output_root: results/ablations/sacm_stc_ssh_debug200/analysis
  primary_metric: dice
  primary_role: All
  metrics:
  - dice
  - iou
  - cldice
  - hd95
  datasets:
  - CHASEDB1
  - CHCrack5k
  - CORN
  - CREMI
  - CrackTree200
  - DCA1
  - DRIVE
  - DeepCrack
  - DeepGlobe
  - FIVES
  - HRF
  - LEAF
  - LES-AV
  - OCTA-500
  - ROAD
  - STARE
  - TYRE
  - TopoMortar
  - WIRE
  - XCAD
  require_train_complete: true
  require_eval_complete: true
  bootstrap_samples: 2000
  seed: 20261111
