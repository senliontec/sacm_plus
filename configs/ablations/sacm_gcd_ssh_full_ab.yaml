# Canonical 800-epoch pair that produced the current best fixed3 model.
#
# Both arms use the same seed, split, schedule and shared arguments.
#   control : native four Stage-2 heads, all-dense / all-head losses
#   ssh     : specialised topology / boundary / recall head losses
#             + zero-initialised linear fusion
#
# The deployed model is derived from the ssh checkpoint with
# make_fixed3_checkpoint.py (head_select=fixed, deployment_head=3,
# head_fusion=0).  The historical result is 56.66 / 43.05 / 63.42 / 64.28.
schema_version: 1
name: sacm_gcd_ssh_full_ab
description: >-
  Same-seed 800-epoch pair: native four-head control vs the canonical
  specialised-head + linear-fusion recipe.
protocol: seeded5
method: sacm_gcd
seeds: [0, 1, 2, 3]
epochs: 800
eval_checkpoint: best_model.pth
expected_datasets: 20
output_root: results/runs/sacm_gcd_ssh_full_ab

wandb:
  project: sacm
  entity: buaazqk
  group: sacm_gcd_ssh_full_ab
  tags: sacm_gcd,ssh,full,800ep,pair
  use_wandb: true

common_train_args:
  sam-checkpoint: checkpoints/sam_vit_l_0b3195.pth
  bce-weight: 0.7
  dice-weight: 0.3
  bce-pos-weight: 2
  binary-targets: 0
  deploy-threshold: 0.5
  stage2-loss-scope: all
  topology-head: all
  topology-resolution: 512
  topology-warmup-epochs: 5
  cl-dice-weight: 0.1
  skeleton-recall-weight: 0.1
  specialized-head-weight: 0.1
  specialized-topology-weight: 0.1
  deep-sup-weight: 0.3
  head-select: gating
  deployment-head: 3
  save-every: 0
  num-workers: 0

arms:
  control:
    display_name: native four-head control
    args:
      specialized-heads: 0
      head-fusion: 0
      fusion-loss-weight: 0.0

  ssh:
    display_name: specialised heads + linear fusion
    args:
      specialized-heads: 1
      head-fusion: 1
      fusion-loss-weight: 1.0

contrasts:
  - id: ssh_minus_control
    left: ssh
    right: control
    label: specialised heads + fusion vs native four-head control

analysis:
  output_root: results/ablations/sacm_gcd_ssh_full_ab/analysis
  primary_metric: dice
  primary_role: All
  metrics:
  - dice
  - iou
  - cldice
  - hd95
  datasets:
  - CHASEDB1
  - CHCrack5k
  - CORN
  - CREMI
  - CrackTree200
  - DCA1
  - DRIVE
  - DeepCrack
  - DeepGlobe
  - FIVES
  - HRF
  - LEAF
  - LES-AV
  - OCTA-500
  - ROAD
  - STARE
  - TYRE
  - TopoMortar
  - WIRE
  - XCAD
  require_train_complete: true
  require_eval_complete: true
  bootstrap_samples: 2000
  seed: 20261111
