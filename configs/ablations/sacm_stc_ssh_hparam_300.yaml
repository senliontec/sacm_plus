# SSH hyperparameter screen (300-epoch, seed 0, paired schedule).
#
# All arms use the canonical full recipe, TPD/POMP/inversion off, linear
# zero-init fusion, and the same 300-epoch schedule; only the SSH
# hyperparameters differ.  This is a screening budget: the winner must be
# confirmed at 800 epochs against the completed sacm_stc full control.
#
# Arms:
#   w010      : default SSH (specialized-head-weight 0.1, fusion 1.0)
#   w005      : specialized-head-weight 0.05
#   w020      : specialized-head-weight 0.2
#   fusion05  : specialized-head-weight 0.1, fusion-loss-weight 0.5
#   fusion20  : specialized-head-weight 0.1, fusion-loss-weight 2.0
schema_version: 1
name: sacm_stc_ssh_hparam_300
description: >-
  300-epoch SSH hyperparameter screen: specialized-head weight and fusion
  loss weight, one variable at a time.
protocol: seeded5
method: sacm_stc
seeds: [0]
epochs: 300
eval_checkpoint: best_model.pth
expected_datasets: 20
# Engineering-only inversion override: OFF by default.
# eval_invert_datasets: [TopoMortar, DeepGlobe, LEAF]
# eval_invert_threshold: 0.2
output_root: results/runs/sacm_stc_ssh_hparam_300

wandb:
  project: sacm
  entity: buaazqk
  group: sacm_stc_ssh_hparam_300
  tags: sacm_stc,ssh,hparam,300ep
  use_wandb: true

common_train_args:
  sam-checkpoint: checkpoints/sam_vit_l_0b3195.pth
  bce-weight: 0.7
  dice-weight: 0.3
  bce-pos-weight: 2
  binary-targets: 0
  deploy-threshold: 0.5
  # canonical full recipe (identical for every arm)
  stage2-loss-scope: all
  stage2-loss-aggregate: deployment
  stage2-aux-weight: 0.25
  topology-head: all
  topology-aggregate: deployment
  topology-aux-weight: 0.25
  topology-resolution: 512
  topology-source: native
  topology-warmup-epochs: 5
  cl-dice-weight: 0.1
  skeleton-recall-weight: 0.1
  deep-sup-weight: 0.3
  iou-loss-weight: 0
  head-select: gating
  deployment-head: 2
  use-stc: 0
  use-typed-stage2: 0
  head-fusion-mode: linear
  head-fusion-warmup-epochs: 0
  specialized-topology-mode: cldice
  # TPD / POMP stay off
  image-dense-prompt: 0
  image-dense-prompt-mode: residual
  morph-prompt: 0
  morph-prompt-gate-threshold: 0.1
  polarity-augment: 0
  polarity-augment-prob: 0.5
  topology-quality: 0
  quality-loss-weight: 0.1
  quality-iou-weight: 0.34
  quality-dice-weight: 0.33
  quality-cldice-weight: 0.33
  quality-resolution: 64
  quality-warmup-epochs: 5
  quality-refine: 0
  quality-refine-topk: 2
  quality-refine-threshold: 0.7
  quality-refine-weight: 0.5
  quality-refine-stage1: 0
  quality-refine-min-score-ratio: 0.5
  quality-select-margin: 0.01
  save-every: 0
  num-workers: 0

arms:
  w010:
    display_name: SSH default (specialized weight 0.1, fusion 1.0)
    args:
      specialized-heads: 1
      specialized-head-weight: 0.1
      head-fusion: 1
      fusion-loss-weight: 1.0
  w005:
    display_name: SSH specialized weight 0.05
    args:
      specialized-heads: 1
      specialized-head-weight: 0.05
      head-fusion: 1
      fusion-loss-weight: 1.0
  w020:
    display_name: SSH specialized weight 0.2
    args:
      specialized-heads: 1
      specialized-head-weight: 0.2
      head-fusion: 1
      fusion-loss-weight: 1.0
  fusion05:
    display_name: SSH fusion-loss weight 0.5
    args:
      specialized-heads: 1
      specialized-head-weight: 0.1
      head-fusion: 1
      fusion-loss-weight: 0.5
  fusion20:
    display_name: SSH fusion-loss weight 2.0
    args:
      specialized-heads: 1
      specialized-head-weight: 0.1
      head-fusion: 1
      fusion-loss-weight: 2.0

contrasts:
  - id: w005_minus_w010
    left: w005
    right: w010
    label: specialized weight 0.05 vs default
  - id: w020_minus_w010
    left: w020
    right: w010
    label: specialized weight 0.2 vs default
  - id: fusion05_minus_w010
    left: fusion05
    right: w010
    label: fusion-loss 0.5 vs default
  - id: fusion20_minus_w010
    left: fusion20
    right: w010
    label: fusion-loss 2.0 vs default

analysis:
  output_root: results/ablations/sacm_stc_ssh_hparam_300/analysis
  primary_metric: dice
  primary_role: All
  metrics:
  - dice
  - iou
  - cldice
  - hd95
  datasets:
  - CHASEDB1
  - CHCrack5k
  - CORN
  - CREMI
  - CrackTree200
  - DCA1
  - DRIVE
  - DeepCrack
  - DeepGlobe
  - FIVES
  - HRF
  - LEAF
  - LES-AV
  - OCTA-500
  - ROAD
  - STARE
  - TYRE
  - TopoMortar
  - WIRE
  - XCAD
  require_train_complete: true
  require_eval_complete: true
  bootstrap_samples: 2000
  seed: 20261111
