# SACM-STC full recipe + TPD.
#
# Control: results/archive/sacm_stc/20261109_170647/default (800 epochs,
# all-dense Stage-2 loss, all-head topology loss): Dice 56.30, IoU 42.69,
# clDice 62.78 on the 20-dataset test set (4 seeds).
# Second control: running method sacm_official (Dice 55.40).
#
# This config changes nothing in the full recipe except adding TPD:
#   - image-conditioned dense prompt (MM-SAM idea)
#   - topology-quality candidate ranking (SAMEO idea)
#   - quality-vetted proposal refinement (E-SAM idea)
schema_version: 1
name: sacm_stc_tpd_full
description: >-
  SACM-STC full (800 epochs, all-dense Stage-2, all-head topology) plus TPD.
  One arm, four seeds, then the standard 20-dataset test evaluation.
protocol: seeded5
method: sacm_stc
seeds: [0, 1, 2, 3]
epochs: 800
eval_checkpoint: best_model.pth
expected_datasets: 20
# Engineering-only inversion override: OFF by default. Uncomment the two
# lines below for an explicit deployment run, and apply the same override to
# every model in that comparison. This is not a method contribution.
# eval_invert_datasets: [TopoMortar, DeepGlobe, LEAF]
# eval_invert_threshold: 0.2
output_root: results/runs/sacm_stc_tpd_full

wandb:
  project: sacm
  entity: buaazqk
  group: sacm_stc_tpd_full
  tags: sacm_stc,tpd,full,800ep
  use_wandb: true

common_train_args:
  sam-checkpoint: checkpoints/sam_vit_l_0b3195.pth
  bce-weight: 0.7
  dice-weight: 0.3
  bce-pos-weight: 2
  binary-targets: 0
  deploy-threshold: 0.5
  # canonical full recipe
  stage2-loss-scope: all
  stage2-loss-aggregate: deployment
  stage2-aux-weight: 0.25
  topology-head: all
  topology-aggregate: deployment
  topology-aux-weight: 0.25
  topology-resolution: 512
  topology-source: native
  topology-warmup-epochs: 5
  cl-dice-weight: 0.1
  skeleton-recall-weight: 0.1
  deep-sup-weight: 0.3
  iou-loss-weight: 0
  head-select: gating
  deployment-head: 2
  use-stc: 0
  use-typed-stage2: 0
  # TPD additions
  image-dense-prompt: 1
  image-dense-prompt-mode: residual
  morph-prompt: 0
  morph-prompt-gate-threshold: 0.1
  polarity-augment: 0
  polarity-augment-prob: 0.5
  topology-quality: 1
  quality-loss-weight: 0.1
  quality-iou-weight: 0.34
  quality-dice-weight: 0.33
  quality-cldice-weight: 0.33
  quality-resolution: 64
  quality-warmup-epochs: 5
  quality-refine: 1
  quality-refine-topk: 2
  quality-refine-threshold: 0.7
  quality-refine-weight: 0.5
  quality-refine-stage1: 1
  quality-refine-min-score-ratio: 0.5
  quality-select-margin: 0.01
  save-every: 0
  num-workers: 0

arms:
  tpd_full:
    display_name: SACM-STC full + TPD (image prompt + quality ranking + refinement)
    args: {}
  tpd_morph:
    display_name: SACM-STC full + TPD + POMP (polarity-invariant ON/OFF prompt)
    args:
      morph-prompt: 1
      morph-prompt-gate-threshold: 0.1
      polarity-augment: 1
      polarity-augment-prob: 0.5
  ssh:
    display_name: SACM-STC full + structure-specialized heads + safe fusion
    args:
      image-dense-prompt: 0
      topology-quality: 0
      quality-refine: 0
      quality-refine-stage1: 0
      specialized-heads: 1
      specialized-head-weight: 0.1
      head-fusion: 1
      fusion-loss-weight: 1.0

contrasts: []

analysis:
  output_root: results/ablations/sacm_stc_tpd_full/analysis
  primary_metric: dice
  primary_role: All
  metrics:
  - dice
  - iou
  - cldice
  - hd95
  datasets:
  - CHASEDB1
  - CHCrack5k
  - CORN
  - CREMI
  - CrackTree200
  - DCA1
  - DRIVE
  - DeepCrack
  - DeepGlobe
  - FIVES
  - HRF
  - LEAF
  - LES-AV
  - OCTA-500
  - ROAD
  - STARE
  - TYRE
  - TopoMortar
  - WIRE
  - XCAD
  require_train_complete: true
  require_eval_complete: true
  bootstrap_samples: 2000
  seed: 20261111
